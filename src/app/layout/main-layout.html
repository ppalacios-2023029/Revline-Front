<!-- ============================================================
  main-layout.html
  Plantilla principal que envuelve toda la aplicación.
  Contiene: fondo oscuro (backdrop), barra lateral (sidebar),
  encabezado fijo (header) y el área de contenido donde Angular
  inyecta la ruta activa mediante <router-outlet>.
  ============================================================ -->
<div class="layout">

  <!-- ── Backdrop ────────────────────────────────────────────────
    Capa semitransparente que cubre el contenido principal cuando
    el sidebar está abierto.
    @if (sidebarOpen()) — directiva de control de flujo de Angular 17+;
    solo renderiza el elemento si la señal sidebarOpen() es verdadera.
    (click)="closeSidebar()" — al hacer clic en el fondo oscuro se
    cierra el sidebar llamando al método closeSidebar() del componente.
  ─────────────────────────────────────────────────────────────── -->
  @if (sidebarOpen()) {
    <div class="backdrop" (click)="closeSidebar()"></div>
  }

  <!-- ── Sidebar ─────────────────────────────────────────────────
    Panel de navegación lateral que se desliza desde la izquierda.
    [class.open]="sidebarOpen()" — binding de clase condicional:
    agrega la clase CSS "open" cuando la señal es verdadera,
    lo que activa la animación de entrada del sidebar.
  ─────────────────────────────────────────────────────────────── -->
  <aside class="sidebar" [class.open]="sidebarOpen()">

    <!-- Cabecera del sidebar: logo de texto y botón de cierre -->
    <div class="sidebar-top">
      <!-- Nombre de la marca mostrado dentro del sidebar -->
      <span class="sidebar-brand">Revline</span>

      <!-- Botón para cerrar el sidebar desde dentro del panel.
           aria-label provee texto accesible para lectores de pantalla. -->
      <button class="close-btn" (click)="closeSidebar()" aria-label="Cerrar menú">✕</button>
    </div>

    <!-- ── Menú de navegación ──────────────────────────────────────
      Cada enlace usa:
      - routerLink: directiva de Angular Router que navega sin recargar página.
      - routerLinkActive="active": añade la clase "active" cuando la ruta
        del enlace coincide con la URL actual, resaltando el ítem actual.
      - (click)="closeSidebar()": cierra el sidebar al seleccionar una ruta
        (útil en móvil para no dejar el panel abierto tras navegar).
      Cada enlace incluye un ícono SVG inline para reforzar el significado
      visual de cada sección.
    ────────────────────────────────────────────────────────────── -->
    <nav class="sidebar-nav">

      <!-- Enlace a la página principal / catálogo público -->
      <a routerLink="/home" routerLinkActive="active" (click)="closeSidebar()">
        <!-- Ícono SVG de casa (home) -->
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/>
        </svg>
        Inicio
      </a>

      <!-- Enlace al CRUD de cascos -->
      <a routerLink="/cascos" routerLinkActive="active" (click)="closeSidebar()">
        <!-- Ícono SVG de casco -->
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2C8 2 4 6 4 10v2h16v-2c0-4-4-8-8-8z"/><rect x="3" y="12" width="18" height="3" rx="1"/>
        </svg>
        Cascos
      </a>

      <!-- Enlace al CRUD de marcas -->
      <a routerLink="/marcas" routerLinkActive="active" (click)="closeSidebar()">
        <!-- Ícono SVG de etiqueta de precio / tag -->
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><circle cx="7" cy="7" r="1" fill="currentColor"/>
        </svg>
        Marcas
      </a>

      <!-- Enlace al CRUD de medidas / tallas -->
      <a routerLink="/medidas" routerLinkActive="active" (click)="closeSidebar()">
        <!-- Ícono SVG de líneas horizontales (regla/talla) -->
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 6H3M21 12H3M21 18H3"/>
        </svg>
        Medidas
      </a>

      <!-- Enlace al CRUD de tipos de casco -->
      <a routerLink="/tipos" routerLinkActive="active" (click)="closeSidebar()">
        <!-- Ícono SVG de cuatro cuadros (categorías) -->
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
        </svg>
        Tipos
      </a>

      <!-- Enlace al CRUD de certificados de seguridad -->
      <a routerLink="/certificados" routerLinkActive="active" (click)="closeSidebar()">
        <!-- Ícono SVG de medalla / certificado -->
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="8" r="6"/><path d="M15.477 12.89L17 22l-5-3-5 3 1.523-9.11"/>
        </svg>
        Certificados
      </a>

      <!-- Enlace al módulo de inventario / stock -->
      <a routerLink="/inventario" routerLinkActive="active" (click)="closeSidebar()">
        <!-- Ícono SVG de caja / paquete (inventario) -->
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 16V8a2 2 0 00-1-1.73l-7-4a2 2 0 00-2 0l-7 4A2 2 0 003 8v8a2 2 0 001 1.73l7 4a2 2 0 002 0l7-4A2 2 0 0021 16z"/>
        </svg>
        Inventario
      </a>

      <!-- Enlace al módulo de ventas -->
      <a routerLink="/ventas" routerLinkActive="active" (click)="closeSidebar()">
        <!-- Ícono SVG de carrito de compras -->
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/>
        </svg>
        Ventas
      </a>

    </nav>
  </aside>

  <!-- ── Header fijo ──────────────────────────────────────────────
    Barra superior que permanece visible en todo momento (position: fixed
    en CSS). Contiene el logo/marca y el botón hamburguesa para abrir
    el sidebar en dispositivos móviles o pantallas pequeñas.
  ─────────────────────────────────────────────────────────────── -->
  <header class="header">

    <!-- Logo + nombre de la marca; navega a /home al hacer clic -->
    <a class="brand" routerLink="/home">
      <!-- Imagen del logo cargada desde Cloudinary (CDN externo) -->
      <img class="brand-logo"
           src="https://res.cloudinary.com/dmv6vhjh4/image/upload/v1780264380/log-removebg-preview_rm289t.png"
           alt="Revline logo" />
      <span>Revline</span>
    </a>

    <!-- Botón hamburguesa (tres líneas).
         [class.open]="sidebarOpen()" — añade la clase "open" cuando el
         sidebar está visible, lo que transforma las tres líneas en una "X"
         mediante CSS (animación de rotación).
         (click)="toggleSidebar()" — alterna el estado abierto/cerrado del sidebar. -->
    <button
      class="hamburger"
      [class.open]="sidebarOpen()"
      (click)="toggleSidebar()"
      aria-label="Abrir menú"
    >
      <!-- Cada <span> es una de las tres líneas horizontales del ícono -->
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <!-- ── Área de contenido principal ─────────────────────────────
    El elemento <main> ocupa el espacio restante debajo del header.
    <router-outlet /> es el punto de inserción de Angular Router:
    aquí se renderiza el componente correspondiente a la ruta activa
    (home, cascos, marcas, etc.) sin recargar la página completa.
  ─────────────────────────────────────────────────────────────── -->
  <main class="content">
    <router-outlet />
  </main>

</div>
