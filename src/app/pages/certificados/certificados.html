<!-- ============================================================
  certificados.html
  Página de administración de certificados de seguridad.
  Los certificados validan que el casco cumple normas de protección
  como DOT (EE.UU.), ECE 22.06 (Europa) o SNELL (norma avanzada).
  Se asignan como FK en cada casco del catálogo.

  Estructura:
  1. Encabezado con título y botón "Nuevo"
  2. Panel de formulario reactivo (condicional)
  3. Tabla con los registros de certificados y acciones
  ============================================================ -->
<div class="page">

  <!-- ── Encabezado de la sección ──────────────────────────────────
    Título de la sección y botón para crear un nuevo certificado.
    (click)="openCreate()" — abre el formulario en modo creación.
  ─────────────────────────────────────────────────────────────── -->
  <div class="page-header">
    <h1>Certificados</h1>
    <button class="btn-primary" (click)="openCreate()">+ Nuevo</button>
  </div>

  <!-- ── Panel de formulario (crear / editar) ───────────────────────
    Visible cuando showForm() es verdadera (señal del componente).
    Aparece con la animación CSS "slideDown".
  ─────────────────────────────────────────────────────────────── -->
  @if (showForm()) {
    <div class="form-panel">

      <!-- Título dinámico:
           editingId() con valor → "Editar Certificado"
           editingId() null      → "Nuevo Certificado" -->
      <h2>{{ editingId() ? 'Editar Certificado' : 'Nuevo Certificado' }}</h2>

      <!-- Banner de error del servidor.
           Ejemplos: nombre duplicado (unique constraint), campo vacío. -->
      @if (errorMsg()) {
        <div class="error-banner">{{ errorMsg() }}</div>
      }

      <!-- Formulario reactivo de Angular.
           [formGroup]="form" — vincula el template con el FormGroup.
           (ngSubmit)="save()" — llama a save() al enviar el formulario. -->
      <form [formGroup]="form" (ngSubmit)="save()">
        <div class="fields">

          <!-- Campo: tipo/nombre del certificado (requerido).
               Ejemplos de valores válidos: DOT, ECE 22.06, SNELL M2020.
               formControlName="tipo" — control reactivo del FormGroup. -->
          <div class="field">
            <label>Tipo *</label>
            <input type="text" formControlName="tipo" placeholder="Ej: DOT, ECE 22.06, SNELL" />
          </div>

          <!-- Campo: descripción del certificado (opcional).
               Puede detallar el alcance de la norma o el organismo certificador. -->
          <div class="field">
            <label>Descripción</label>
            <input type="text" formControlName="descripcion" placeholder="Descripción" />
          </div>

        </div>

        <!-- Botones de acción:
             "Cancelar" — oculta el formulario sin guardar.
             "Guardar"  — deshabilitado si form.invalid (campo tipo vacío). -->
        <div class="form-actions">
          <button type="button" class="btn-secondary" (click)="cancel()">Cancelar</button>
          <button type="submit" class="btn-primary" [disabled]="form.invalid">Guardar</button>
        </div>
      </form>
    </div>
  }

  <!-- ── Tabla de certificados ─────────────────────────────────────
    Lista todos los certificados de seguridad registrados.
  ─────────────────────────────────────────────────────────────── -->
  <div class="table-container">
    <table>
      <thead>
        <tr>
          <th>Tipo</th>
          <th>Descripción</th>
          <!-- Columna de botones por fila -->
          <th>Acciones</th>
        </tr>
      </thead>
      <tbody>

        <!-- @for — itera sobre la señal items() con los certificados.
             track item.id_certificado — UUID único como clave de seguimiento. -->
        @for (item of items(); track item.id_certificado) {
          <tr>
            <!-- Nombre/tipo del certificado (ej: "ECE 22.06") -->
            <td>{{ item.tipo }}</td>

            <!-- Descripción opcional; '—' como valor por defecto si es null -->
            <td>{{ item.descripcion || '—' }}</td>

            <!-- Acciones por fila:
                 openEdit(item) — carga el certificado en el formulario.
                 delete(item.id_certificado) — elimina el certificado; el backend
                 rechaza la operación si hay cascos que usan este certificado. -->
            <td>
              <div class="actions">
                <button class="btn-edit" (click)="openEdit(item)">Editar</button>
                <button class="btn-delete" (click)="delete(item.id_certificado)">Eliminar</button>
              </div>
            </td>
          </tr>

        <!-- @empty — mensaje cuando no hay certificados registrados.
             colspan="3" agrupa las tres columnas en una sola celda. -->
        } @empty {
          <tr><td colspan="3" class="empty">Sin registros</td></tr>
        }
      </tbody>
    </table>
  </div>
</div>
